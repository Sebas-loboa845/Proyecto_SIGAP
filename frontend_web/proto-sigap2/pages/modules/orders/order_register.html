<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Pedidos</title>
    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>
    <!-- =====================================================
         REGISTRAR PEDIDO
    ====================================================== -->

    <section id="registrar-pedido" class="pantalla pantalla-app">

        <header class="app-header">

            <div class="logo">
                <span class="logo-icon pequeño">S</span>
                <h1>SIGAP</h1>
            </div>

            <a href="order_read.html" class="btn btn-secundario">
                ← Pedidos
            </a>

        </header>


        <main class="contenido-app">

            <div class="form-contenedor grande">

                <div class="titulo-pantalla">

                    <span class="icono">🚚</span>

                    <div>
                        <h2>Registrar pedido</h2>
                        <p>Crear un nuevo pedido de producto</p>
                    </div>

                </div>


                <form id="order-create-form" class="formulario formulario-grid" data-crud-form="order-create">

                    <div>
                        <label>Producto</label>

                        <select data-field="product">
                            <option>Seleccione producto</option>
                            <option>Panela cuadrada</option>
                            <option>Panela redonda</option>
                            <option>Panela pulverizada</option>
                            <option>Panela granulada</option>
                            <option>Panela en cubos</option>
                            <option>Panela saborizada</option>
                        </select>

                    </div>

                    <div>
                        <label>Cantidad</label>
                        <input type="number" placeholder="Cantidad" data-field="quantity" min="0">
                    </div>

                    <div>
                        <label>Proveedor</label>
                        <input type="text" placeholder="Nombre del proveedor" data-field="supplier" required>
                    </div>

                    <div>
                        <label>Fecha estimada</label>
                        <input type="date" data-field="date" required>
                    </div>

                    <div class="campo-completo">

                        <label>Observaciones</label>

                        <textarea
                            placeholder="Información adicional del pedido"
                         data-field="observations"></textarea>

                    </div>

                </form>


                <div class="acciones">

                    <a href="order_read.html" class="btn btn-secundario">
                        Cancelar
                    </a>

                    <a href="order_read.html" type="button" class="btn btn-principal" data-submit="order-delete">
                        Registrar pedido
                    </a>

                </div>

            </div>

        </main>

    </section>
    <script src="../../../assets/landing/js/script.js"></script>
</body>
</html>
