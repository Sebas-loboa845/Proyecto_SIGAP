
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Pedido</title>
    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>

    <!-- =====================================================
         ACTUALIZAR PEDIDO
    ====================================================== -->

    <section id="actualizar-pedido" class="pantalla pantalla-app">

        <header class="app-header">

            <div class="logo">
                <span class="logo-icon pequeño">S</span>
                <h1>SIGAP</h1>
            </div>

            <a href="order_read.html" class="btn btn-secundario">
                ← Pedidos
            </a>

        </header>

        <main class="contenido-app">

            <div class="form-contenedor grande">

                <div class="titulo-pantalla">

                    <span class="icono">✏️</span>

                    <div>
                        <h2>Actualizar pedido</h2>
                        <p>Modificar la información de un pedido existente</p>
                    </div>

                </div>

                <form id="order-update-form" class="formulario formulario-grid" data-crud-form="order-update">

                    <div>
                        <label>Producto</label>

                        <select data-field="product">
                            <option>Seleccione producto</option>
                            <option selected>Panela cuadrada</option>
                            <option>Panela redonda</option>
                            <option>Panela pulverizada</option>
                            <option>Panela granulada</option>
                            <option>Panela en cubos</option>
                            <option>Panela saborizada</option>
                        </select>

                    </div>

                    <div>
                        <label>Cantidad</label>
                        <input type="number" value="100" data-field="quantity" min="0">
                    </div>

                    <div>
                        <label>Proveedor</label>
                        <input type="text" value="Proveedor principal" data-field="supplier" required>
                    </div>

                    <div>
                        <label>Fecha estimada</label>
                        <input type="date" value="2026-12-15" data-field="date" required>
                    </div>

                    <div class="campo-completo">

                        <label>Observaciones</label>

                        <textarea data-field="observations">Pedido de panela para abastecimiento de inventario.</textarea>

                    </div>

                </form>

                <div class="acciones">

                    <a href="order_read.html" class="btn btn-secundario">
                        Cancelar
                    </a>

                    <a href="order_read.html" type="button" class="btn btn-principal" data-submit="order-delete">
                        Guardar cambios
                    </a>

                </div>

            </div>

        </main>

    </section>

    <script src="../../../assets/landing/js/script.js"></script>
</body>
</html>
