
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario - SIGAP</title>

    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>

<body>

    <!-- REGISTRO DE USUARIO SIGAP -->

    <section id="registro" class="pantalla">

        <div class="form-contenedor grande">

            <div class="titulo-pantalla">
                <span class="icono">👤</span>
                <div>
                    <h2>Registrar usuario</h2>
                    <p>Crear una nueva cuenta en SIGAP</p>
                </div>
            </div>

            <form class="formulario formulario-grid">

                <!-- IDENTIFICACIÓN DEL USUARIO -->

                <div>
                    <label for="id_usuario">ID de usuario</label>
                    <input
                        type="text"
                        id="id_usuario"
                        name="id_usuario"
                        placeholder="Ej: USR-001"
                        required>
                </div>

                <!-- TIPO DE USUARIO -->

                <div>
                    <label for="tipo_usuario">Tipo de usuario</label>
                    <select id="tipo_usuario" name="tipo_usuario" required>
                        <option value="">Seleccione un tipo de usuario</option>
                        <option value="proveedor">Proveedor</option>
                        <option value="empleado">Empleado</option>
                    </select>
                </div>

                <!-- DATOS PERSONALES -->

                <div>
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Nombre"
                        required>
                </div>

                <div>
                    <label for="apellidos">Apellidos</label>
                    <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        placeholder="Apellidos"
                        required>
                </div>

                <div>
                    <label for="tipo_documento">Tipo de documento</label>
                    <select id="tipo_documento" name="tipo_documento" required>
                        <option value="">Seleccione</option>
                        <option value="CC">Cédula de ciudadanía</option>
                        <option value="CE">Cédula de extranjería</option>
                    </select>
                </div>

                <div>
                    <label for="documento">Número de documento</label>
                    <input
                        type="text"
                        id="documento"
                        name="documento"
                        placeholder="Número de documento"
                        required>
                </div>

                <!-- INFORMACIÓN DE CONTACTO -->

                <div>
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Correo electrónico"
                        required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Teléfono"
                        required>
                </div>

                <!-- SEGURIDAD -->

                <div>
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Contraseña"
                        required>
                </div>

                <div>
                    <label for="confirmar_password">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmar_password"
                        name="confirmar_password"
                        placeholder="Confirmar contraseña"
                        required>
                </div>

            </form>

            <!-- BOTONES -->

            <div class="acciones">

                <a href="../../roles/admin.html" class="btn btn-secundario">
                    Cancelar
                </a>

                <a href="../../roles/admin.html"  class="btn btn-principal" >
                    Registrar usuario
                </a>

            </div>

        </div>

    </section>

</body>
</html>
