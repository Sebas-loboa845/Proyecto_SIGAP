
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Producto</title>
    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>

    <!-- =====================================================
         ACTUALIZAR PRODUCTO
    ====================================================== -->

    <section id="actualizar-producto" class="pantalla pantalla-app">

        <header class="app-header">

            <div class="logo">
                <span class="logo-icon pequeño">S</span>
                <h1>SIGAP</h1>
            </div>

            <a href="products_read.html" class="btn btn-secundario">
                ← Productos
            </a>

        </header>

        <main class="contenido-app">

            <div class="form-contenedor grande">

                <div class="titulo-pantalla">
                    <span class="icono">✏️</span>

                    <div>
                        <h2>Actualizar producto</h2>
                        <p>Modificar la información de un producto existente</p>
                    </div>
                </div>

                <form class="formulario formulario-grid">

                    <div>
                        <label>Código del producto</label>
                        <input type="text" value="PROD-001">
                    </div>

                    <div>
                        <label>Nombre del producto</label>
                        <input type="text" value="Panela tradicional">
                    </div>

                    <div>
                        <label>Tipo de panela</label>

                        <select>
                            <option>Seleccione</option>
                            <option selected>Panela cuadrada</option>
                            <option>Panela redonda</option>
                            <option>Panela pulverizada</option>
                            <option>Panela granulada</option>
                            <option>Panela en cubos</option>
                            <option>Panela saborizada</option>
                        </select>

                    </div>

                    <div>
                        <label>Precio</label>
                        <input type="number" value="5000">
                    </div>

                    <div>
                        <label>Cantidad</label>
                        <input type="number" value="100">
                    </div>

                    <div>
                        <label>Estado</label>

                        <select>
                            <option selected>Disponible</option>
                            <option>Agotado</option>
                            <option>Inactivo</option>
                        </select>

                    </div>

                    <div class="campo-completo">
                        <label>Descripción</label>

                        <textarea>Panela tradicional de presentación cuadrada.</textarea>

                    </div>

                </form>

                <div class="acciones">

                    <a href="products_read.html" class="btn btn-secundario">
                        Cancelar
                    </a>

                    <a href="products_read.html" class="btn btn-principal">
                        Guardar cambios
                    </a>

                </div>

            </div>

        </main>

    </section>

</body>
</html>
