
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto</title>
    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>

    <!-- =====================================================
         ELIMINAR PRODUCTO
    ====================================================== -->

    <section id="eliminar-producto" class="pantalla pantalla-app">

        <header class="app-header">

            <div class="logo">
                <span class="logo-icon pequeño">S</span>
                <h1>SIGAP</h1>
            </div>

            <a href="products_read.html" class="btn btn-secundario">
                ← Productos
            </a>

        </header>

        <main class="contenido-app">

            <div class="form-contenedor grande">

                <div class="titulo-pantalla">
                    <span class="icono">🗑️</span>

                    <div>
                        <h2>Eliminar producto</h2>
                        <p>Eliminar un producto del catálogo</p>
                    </div>
                </div>

                <form class="formulario formulario-grid">

                    <div>
                        <label>Código del producto</label>
                        <input type="text" placeholder="PROD-000">
                    </div>

                    <div>
                        <label>Nombre del producto</label>
                        <input type="text" placeholder="Nombre del producto">
                    </div>

                    <div>
                        <label>Tipo de panela</label>
                        <input type="text" placeholder="Tipo de panela">
                    </div>

                    <div>
                        <label>Precio</label>
                        <input type="number" placeholder="$">
                    </div>

                    <div>
                        <label>Cantidad</label>
                        <input type="number" placeholder="Cantidad">
                    </div>

                    <div>
                        <label>Estado</label>
                        <input type="text" placeholder="Estado">
                    </div>

                    <div class="campo-completo">
                        <label>Descripción</label>
                        <textarea placeholder="Descripción del producto"></textarea>
                    </div>

                </form>

                <div class="acciones">

                    <a href="products_read.html" class="btn btn-secundario">
                        Cancelar
                    </a>

                    <a href="products_read.html" class="btn btn-principal">
                        Eliminar producto
                    </a>

                </div>

            </div>

        </main>

    </section>

</body>
</html>
