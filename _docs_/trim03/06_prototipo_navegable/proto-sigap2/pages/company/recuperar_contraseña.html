<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../assets/landing/css/landing_style.css">
</head>
<body>
    <!-- =====================================================
         RECUPERAR CONTRASEÑA
    ====================================================== -->

    <section id="recuperar" class="pantalla">

        <div class="form-contenedor">

            <span class="icono-grande">🔐</span>

            <h2>Recuperar contraseña</h2>

            <p>
                Ingrese su correo electrónico para recuperar
                el acceso a su cuenta.
            </p>

            <form class="formulario">

                <label>Correo electrónico</label>

                <input
                    type="email"
                    placeholder="ejemplo@correo.com"
                >

                <a href="login.html" class="btn btn-principal btn-completo">
                    Recuperar contraseña
                </a>

            </form>

            <a href="login.html" class="volver">
                ← Volver al inicio de sesión
            </a>

        </div>

    </section>

</body>
</html>
