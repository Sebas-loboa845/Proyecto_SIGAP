<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Venta</title>
    <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>
    <!-- =====================================================
         REGISTRAR VENTA
    ====================================================== -->

    <section id="registrar-venta" class="pantalla pantalla-app">

        <header class="app-header">

            <div class="logo">
                <span class="logo-icon pequeño">S</span>
                <h1>SIGAP</h1>
            </div>

            <a href="sales_read.html" class="btn btn-secundario">
                ← Ventas
            </a>

        </header>


        <main class="contenido-app">

            <div class="form-contenedor grande">

                <div class="titulo-pantalla">

                    <span class="icono">🛒</span>

                    <div>
                        <h2>Registrar venta</h2>
                        <p>Crear una nueva venta</p>
                    </div>

                </div>


                <form class="formulario formulario-grid">

                    <div>
                        <label>Cliente</label>
                        <select>
                            <option>Seleccione cliente</option>
                            <option>Juan Pérez</option>
                            <option>María López</option>
                            <option>Carlos Gómez</option>
                        </select>
                    </div>

                    <div>
                        <label>Producto</label>
                        <select>
                            <option>Seleccione producto</option>
                            <option>Panela cuadrada</option>
                            <option>Panela redonda</option>
                            <option>Panela pulverizada</option>
                            <option>Panela granulada</option>
                            <option>Panela en cubos</option>
                            <option>Panela saborizada</option>
                        </select>
                    </div>

                    <div>
                        <label>Cantidad</label>
                        <input type="number" placeholder="Cantidad">
                    </div>

                    <div>
                        <label>Forma de pago</label>
                        <select>
                            <option>Seleccione</option>
                            <option>Efectivo</option>
                            <option>Transferencia</option>
                            <option>Tarjeta</option>
                        </select>
                    </div>

                    <div class="campo-completo">

                        <label>Observaciones</label>

                        <textarea
                            placeholder="Observaciones de la venta"
                        ></textarea>

                    </div>

                </form>


                <div class="resumen-venta">

                    <span>Total de la venta</span>

                    <strong>$0</strong>

                </div>


                <div class="acciones">

                    <a href="sales_read.html" class="btn btn-secundario">
                        Cancelar
                    </a>

                    <a href="sales_read.html" class="btn btn-principal">
                        Registrar venta
                    </a>

                </div>

            </div>

        </main>

    </section>

</body>
</html>
