<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
     <link rel="stylesheet" href="../../../assets/dashboard/css/styles.css">
    <link rel="stylesheet" href="../../../assets/landing/css/landing_style.css">
</head>
<body>
    <!-- =====================================================
         REGISTRO DE USUARIO
    ====================================================== -->

    <section id="registro" class="pantalla">

        <div class="form-contenedor grande">

            <div class="titulo-pantalla">
                <span class="icono">👤</span>
                <div>
                    <h2>Registrar usuario</h2>
                    <p>Crear una nueva cuenta en SIGAP</p>
                </div>
            </div>

            <form class="formulario formulario-grid">

                <div>
                    <label>Nombre</label>
                    <input type="text" placeholder="Nombre">
                </div>

                <div>
                    <label>Apellidos</label>
                    <input type="text" placeholder="Apellidos">
                </div>

                <div>
                    <label>Tipo de documento</label>
                    <select>
                        <option>Cédula de ciudadanía</option>
                    </select>
                </div>

                <div>
                    <label>Número de documento</label>
                    <input type="text" placeholder="Número de documento">
                </div>

                <div>
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="Correo">
                </div>

                <div>
                    <label>Teléfono</label>
                    <input type="tel" placeholder="Teléfono">
                </div>

                <div>
                    <label>Contraseña</label>
                    <input type="password" placeholder="Contraseña">
                </div>

                <div>
                    <label>Confirmar contraseña</label>
                    <input type="password" placeholder="Confirmar contraseña">
                </div>

            </form>

            <div class="acciones">
                <a href="../../company/login.html" class="btn btn-secundario">
                    Cancelar
                </a>

                <a href="../../company/login.html" class="btn btn-principal">
                    Registrar usuario
                </a>
            </div>

        </div>

    </section>

   </body>
   </html>
</body>
</html>
